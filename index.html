<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Hábitos Saudáveis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌱 Hábitos Saudáveis</h1>
  <p>Marque os hábitos que você cumpriu hoje:</p>

  <div id="habits">
    <label><input type="checkbox" id="agua"> Beber 2L de água 💧</label><br>
    <label><input type="checkbox" id="exercicio"> Fazer 30 min de exercício 🏃</label><br>
    <label><input type="checkbox" id="sono"> Dormir 8 horas 😴</label><br>
    <label><input type="checkbox" id="alimentacao"> Comer frutas/vegetais 🍎</label><br>
    <label><input type="checkbox" id="meditacao"> Meditar 10 min 🧘</label><br>
  </div>

  <p id="status">Progresso: 0/5 hábitos</p>
  <button id="reset">Resetar</button>

  <script src="script.js"></script>
</body>
</html>
